# Read the Docs build of the API reference (docs/). Connect the GitHub repository at
# readthedocs.org to publish it; nothing else is needed.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: docs/requirements.txt
