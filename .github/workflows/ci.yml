name: ci

# CI runs on the public repository (petervanwylen/PyRoOrb) only. This file is identical in
# PyRoOrb-dev, which release_public.py projects from, so every job carries the same
# repository gate: in PyRoOrb-dev nothing runs (owner, 2026-11-02).

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"          # nightly: the full offline suite
  workflow_dispatch:

env:
  PYROORB_CACHE_DIR: ${{ github.workspace }}/.pyroorb-cache
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  guard:
    # Fails loudly if a path that belongs in the private development repository is ever
    # pushed here (the same list the hygiene and boundary tests use).
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: no private path in the tree
        run: |
          python - <<'EOF'
          import ast, subprocess, sys
          src = open("tests/test_public_code_hygiene.py").read()
          private = next(tuple(ast.literal_eval(n.value)) for n in ast.parse(src).body
                         if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "PRIVATE")
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          bad = [f for f in files if f.startswith(private)]
          if bad:
              sys.exit("private paths in the public repository:\n" + "\n".join(bad))
          print(f"{len(files)} files, none private")
          EOF

  secrets:
    # gitleaks over the repository's whole history on every push: a credential committed by
    # mistake is caught at once, before it spreads. Pinned version,
    # checked against its published SHA-256; findings are printed with the secret redacted.
    # A false positive is silenced with a `gitleaks:allow` comment on its line.
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.0"
      GITLEAKS_SHA256: "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
      - name: scan the history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  tests:
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    strategy:
      fail-fast: false
      matrix:
        # Windows is not yet supported (coming in late 2026); add windows-latest back then.
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: OpenMP runtime for xgboost (macOS ships none)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: install (one plain pip command; ASSIST compiles in its own isolated build)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,itf]"
          # the private development repository's own modules also need scikit-learn
          if [ -f requirements.txt ]; then python -m pip install scikit-learn; fi
      - name: reference tables (DE440, debias), cached between runs
        uses: actions/cache@v4
        with:
          path: ${{ env.PYROORB_CACHE_DIR }}
          # The nightly full suite also needs the 616 MB asteroid kernel: the goldens of
          # multi-opposition fixtures were recorded with the 16 perturbers on (944 Hidalgo picks
          # another nongrav model without them). Its own key, so a cache saved by a push run
          # without the kernel is never the one the nightly run restores.
          key: pyroorb-tables-v1-${{ runner.os }}${{ github.event_name == 'schedule' && '-ast' || '' }}
      - run: pyroorb-fetch-data ${{ github.event_name == 'schedule' && '--asteroids' || '' }}
      - name: tests (offline; the timing guard is off under CI)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m pytest -n 4
          else
            python -m pytest -m "not slow" -n 4
          fi

  install-script:
    # install.sh, the README's recommended install, run end to end on fresh runners: it installs
    # uv itself, makes .venv with a uv-managed Python, compiles ASSIST in one uv command. Then
    # the web UI must start. The default install has no ITF extra (no xgboost, no libomp); a
    # second run adds it, which on macOS installs Homebrew's libomp for the ITF ranker.
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ./install.sh
        run: ./install.sh --no-data --yes
      - name: the install works
        shell: bash
        run: |
          .venv/bin/python -c "import pyroorb, assist, rebound; print('rebound', rebound.__version__)"
          if .venv/bin/python -c "import xgboost" 2>/dev/null; then echo "the default install pulled in xgboost"; exit 1; fi
          .venv/bin/pyroorb --help | head -1
          .venv/bin/pyroorb-web --port 8765 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/healthz && exit 0; sleep 2; done
          echo "the web UI did not answer /healthz"; exit 1
      - name: ./install.sh --extras itf (re-run adds the ITF extra)
        run: ./install.sh --extras itf --no-data --yes
      - name: the ITF ranker loads
        run: .venv/bin/python -c "import xgboost; print('xgboost', xgboost.__version__)"

  web-pages:
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save jsdom
      - name: jsdom page tests
        # tests/private/web holds the private modules' page tests; it exists only in the
        # development repository, and nullglob makes the loop skip it where it is absent.
        shell: bash
        run: |
          shopt -s nullglob
          for t in tests/web/*.js tests/private/web/*.js; do echo "== $t"; node "$t" || exit 1; done

  wheel:
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: build the wheel; it holds no tests and no private material
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          bad = [n for n in names if n.startswith(("tests/", "lab/")) or n.endswith(".npz")]
          assert not bad, bad
          need = ["pyroorb/web/static/index.html", "pyroorb/package_data/ObsCodes.htm",
                  "pyroorb/digest2/data/digest2.model.csv", "pyroorb/itf/training_data/itf_match_v4.json"]
          missing = [n for n in need if n not in names]
          assert not missing, missing
          print(len(names), "files in the wheel")
          EOF
      - name: install it in a fresh environment and run the commands
        run: |
          python -m venv /tmp/w && . /tmp/w/bin/activate
          python -m pip install -U pip
          python -m pip install dist/*.whl
          cd /tmp && python -c "import pyroorb, pyroorb.web.server; print(pyroorb.__file__)"
          pyroorb --help && pyroorb-itf --help && pyroorb-fetch-data --help
