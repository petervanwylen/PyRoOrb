name: ci

# CI runs on the public repository (petervanwylen/PyRoOrb) only. This file is identical in
# PyRoOrb-dev, which release_public.py projects from, so every job carries the same
# repository gate: in PyRoOrb-dev nothing runs (owner, 2026-11-02).

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"          # nightly: the same fast suite, against that day's newest packages
  workflow_dispatch:

env:
  PYROORB_CACHE_DIR: ${{ github.workspace }}/.pyroorb-cache
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  guard:
    # Fails loudly if a path that belongs in the private development repository is ever
    # pushed here (the same list the hygiene and boundary tests use).
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: no private path in the tree
        run: |
          python - <<'EOF'
          import ast, subprocess, sys
          src = open("tests/test_public_code_hygiene.py").read()
          private = next(tuple(ast.literal_eval(n.value)) for n in ast.parse(src).body
                         if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "PRIVATE")
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          bad = [f for f in files if f.startswith(private)]
          if bad:
              sys.exit("private paths in the public repository:\n" + "\n".join(bad))
          print(f"{len(files)} files, none private")
          EOF

  secrets:
    # gitleaks over the repository's whole history on every push: a credential committed by
    # mistake is caught at once, before it spreads. Pinned version,
    # checked against its published SHA-256; findings are printed with the secret redacted.
    # A false positive is silenced with a `gitleaks:allow` comment on its line.
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.0"
      GITLEAKS_SHA256: "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
      - name: scan the history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  tests:
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # Windows: REBOUND 4 publishes Windows wheels for CPython 3.10-3.12 only.
        include:
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: OpenMP runtime for xgboost (macOS ships none)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: install (ASSIST built against exactly the REBOUND it runs with)
        # ASSIST compiles against REBOUND's headers and runs against REBOUND's library: REBOUND
        # first, ASSIST built without isolation against it, then the rest pinned to the same
        # REBOUND. (The wheel job below checks the plain one-command pip install.)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install "rebound>=4.4.11,<5" numpy setuptools wheel
          python -c "import rebound; print('rebound==' + rebound.__version__)" > "$RUNNER_TEMP/rebound.txt"
          # The ASSIST release on PyPI does not build on Windows yet: there it comes from the fork
          # with native Windows support, at the commit install.ps1 pins.
          if [ "$RUNNER_OS" = Windows ]; then
            ASSIST="assist @ git+https://github.com/petervanwylen/assist-win-support@20d12ef89b3c97e09dfb70f11d59c0d840b52eee"
          else
            ASSIST="assist>=1.2,<1.3"
          fi
          python -m pip install --no-cache-dir --no-build-isolation "$ASSIST"
          python -m pip install -c "$RUNNER_TEMP/rebound.txt" -e ".[dev,itf]"
          # the private development repository's own modules also need scikit-learn
          if [ -f requirements.txt ]; then python -m pip install scikit-learn; fi
      - name: reference tables (DE440, debias), cached between runs
        uses: actions/cache@v4
        with:
          path: ${{ env.PYROORB_CACHE_DIR }}
          key: pyroorb-tables-v1-${{ runner.os }}
      - run: pyroorb-fetch-data
      # CI catches incompatibilities: installs, platforms, new package releases. The slow tests
      # are run locally: they pin the outcomes of whole fits, and on a sensitive orbit those move
      # with the last bits of the arithmetic, which differ between platforms and package versions.
      - name: tests (offline; the timing guard is off under CI)
        run: python -m pytest -m "not slow" -n 4

  install-script:
    # install.sh, the README's recommended install, run end to end on fresh runners: it installs
    # uv itself, makes .venv with a uv-managed Python, compiles ASSIST in one uv command. Then
    # the web UI must start. The default install has no ITF extra (no xgboost, no libomp); a
    # second run adds it, which on macOS installs Homebrew's libomp for the ITF ranker. Last, the
    # uninstall: in a checkout it did not download it removes .venv and the commands it put on
    # PATH, and keeps the checkout. Windows runs install.ps1, its PowerShell counterpart, the same way.
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ./install.sh
        if: runner.os != 'Windows'
        run: ./install.sh --no-data --yes
      - name: the install works
        if: runner.os != 'Windows'
        shell: bash
        run: |
          .venv/bin/python -c "import pyroorb, assist, rebound; print('rebound', rebound.__version__)"
          if .venv/bin/python -c "import xgboost" 2>/dev/null; then echo "the default install pulled in xgboost"; exit 1; fi
          .venv/bin/pyroorb --help | head -1
          "$HOME/.local/bin/pyroorb" --help | head -1      # the command the script put on PATH
          .venv/bin/pyroorb-web --port 8765 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/healthz && exit 0; sleep 2; done
          echo "the web UI did not answer /healthz"; exit 1
      - name: ./install.sh --extras itf (re-run adds the ITF extra)
        if: runner.os != 'Windows'
        run: ./install.sh --extras itf --no-data --yes
      - name: the ITF ranker loads
        if: runner.os != 'Windows'
        run: .venv/bin/python -c "import xgboost; print('xgboost', xgboost.__version__)"
      - name: ./install.sh --uninstall
        if: runner.os != 'Windows'
        run: |
          ./install.sh --uninstall --yes
          test ! -e .venv && test -f install.sh
          for c in pyroorb pyroorb-web pyroorb-itf pyroorb-fetch-data; do test ! -e "$HOME/.local/bin/$c"; done
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -NoData -Yes
      - name: the install works (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          .venv/Scripts/python -c "import pyroorb, assist, rebound; print('rebound', rebound.__version__)"
          if .venv/Scripts/python -c "import xgboost" 2>/dev/null; then echo "the default install pulled in xgboost"; exit 1; fi
          .venv/Scripts/pyroorb --help | head -1
          ~/.local/bin/pyroorb.exe --help | head -1      # the command the script put on PATH
          .venv/Scripts/pyroorb-web --port 8765 &
          ok=1
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/healthz && { ok=0; break; }; sleep 2; done
          # Stop it: Windows will not replace a running .exe, so the re-install below would fail.
          taskkill //F //T //IM pyroorb-web.exe || true
          [ $ok = 0 ] || { echo "the web UI did not answer /healthz"; exit 1; }
      - name: install.ps1 -Extras itf (re-run adds the ITF extra)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Extras itf -NoData -Yes
      - name: the ITF ranker loads (Windows)
        if: runner.os == 'Windows'
        run: .venv/Scripts/python -c "import xgboost; print('xgboost', xgboost.__version__)"
      - name: install.ps1 -Uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $here = $PWD.Path
          ./install.ps1 -Uninstall -Yes
          if ($PWD.Path -ne $here) { throw "the uninstall moved this shell to $($PWD.Path)" }
          if (Test-Path "$env:GITHUB_WORKSPACE\.venv") { throw ".venv is still there" }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\install.ps1")) { throw "the checkout was removed" }
          foreach ($c in "pyroorb", "pyroorb-web", "pyroorb-itf", "pyroorb-fetch-data") {
            if (Test-Path "$HOME\.local\bin\$c.exe") { throw "$c.exe is still in ~\.local\bin" }
          }

  web-pages:
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save jsdom
      - name: jsdom page tests
        # tests/private/web holds the private modules' page tests; it exists only in the
        # development repository, and nullglob makes the loop skip it where it is absent.
        shell: bash
        run: |
          shopt -s nullglob
          for t in tests/web/*.js tests/private/web/*.js; do echo "== $t"; node "$t" || exit 1; done

  wheel:
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: build the wheel; it holds no tests and no private material
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          bad = [n for n in names if n.startswith(("tests/", "lab/")) or n.endswith(".npz")]
          assert not bad, bad
          need = ["pyroorb/web/static/index.html", "pyroorb/package_data/ObsCodes.htm",
                  "pyroorb/digest2/data/digest2.model.csv", "pyroorb/itf/training_data/itf_match_v4.json"]
          missing = [n for n in need if n not in names]
          assert not missing, missing
          print(len(names), "files in the wheel")
          EOF
      - name: install it in a fresh environment and run the commands
        run: |
          python -m venv /tmp/w && . /tmp/w/bin/activate
          python -m pip install -U pip
          python -m pip install dist/*.whl
          cd /tmp && python -c "import pyroorb, pyroorb.web.server; print(pyroorb.__file__)"
          pyroorb --help && pyroorb-itf --help && pyroorb-fetch-data --help

  docker:
    # The web UI image (docker/Dockerfile): every push and pull request builds it, starts it and
    # waits for /healthz; a push to main (or a v* tag) also publishes it for amd64 + arm64 as
    # ghcr.io/petervanwylen/pyroorb (:latest from main, :X.Y.Z from a tag, :sha-... always).
    needs: guard
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build the image (this runner's architecture)
        uses: docker/build-push-action@v6
        with: {context: ., file: docker/Dockerfile, load: true, tags: "pyroorb:ci"}
      - name: the image serves the web UI
        run: |
          docker run -d --name web -p 8000:8000 -e PYROORB_FETCH_DATA=0 pyroorb:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/healthz && exit 0; sleep 2; done
          docker logs web; echo "the image did not answer /healthz"; exit 1
      - name: image tags
        id: meta
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/petervanwylen/pyroorb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: log in to the GitHub container registry
        if: steps.meta.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish (amd64 + arm64)
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
