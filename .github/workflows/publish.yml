name: publish

# Publishes to PyPI when a v* tag is pushed to the public repository. Uses PyPI trusted
# publishing (OIDC): no token is stored. One-time setup on pypi.org -> pyroorb -> Publishing:
# owner petervanwylen, repository PyRoOrb, workflow publish.yml, environment pypi.
# This file is identical in PyRoOrb-dev; the repository gate keeps it inert there.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  pypi:
    needs: build
    if: github.repository == 'petervanwylen/PyRoOrb'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
